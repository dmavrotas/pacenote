[package]
name = "pacenote"
version = "0.1.0"
edition = "2024"
description = "A co-driver for Claude Code: token-usage analytics and prompt linting"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["claude", "llm", "tokens", "cli", "prompt"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
