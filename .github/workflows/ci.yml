name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bench:
    # Offline benchmark: asserts stats accuracy against ground truth and
    # publishes lint quality, throughput and hook latency in the job summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench offline
        env:
          PACENOTE_BENCH_MB: "50"
      - run: cat target/bench/offline.md >> "$GITHUB_STEP_SUMMARY"

  fixture:
    # The e2e fixture must keep exactly its two planted bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: bench/fixture
        run: |
          python -m unittest tests.test_inventory tests.test_users tests.test_report
          for bug in tests.test_pagination tests.test_pricing; do
            if python -m unittest "$bug" 2>/dev/null; then
              echo "::error::$bug passes, but the fixture must keep its planted bug"
              exit 1
            fi
          done
