name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bench:
    # Offline benchmark: asserts stats accuracy against ground truth and
    # publishes lint quality, throughput and hook latency in the job summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench offline
        env:
          PACENOTE_BENCH_MB: "50"
      - run: cat target/bench/offline.md >> "$GITHUB_STEP_SUMMARY"

  fixture:
    # The e2e fixture must be clean, and every task's injected bug must
    # break the tests it is scored on. Free: no Claude calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo run --release --example e2e -- --check-fixture --python python
